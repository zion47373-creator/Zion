<style>
:root{
  --primary:#96BB54;--primary2:#b5db72;--bg:#151922;--surface:#202631;--surface2:#2a313e;

}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:auto;overscroll-behavior-x:none}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;overscroll-behavior-y:none}

button,input{font:inherit}

a{color:inherit;text-decoration:none}

}
.brand{display:flex;align-items:center;gap:10px;min-width:max-content;font-weight:800;font-size:20px}

.desktop-nav{display:flex;gap:5px}

}
.desktop-nav button:hover,.desktop-nav button.active,.header-action:hover{background:rgba(255,255,255,.07);color:#fff}
.search-wrap{flex:1;max-width:620px;margin:auto}

.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);margin:0;color:#858996;pointer-events:none}

.menu-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}

.filter:hover,.filter.active{background:rgba(150,187,84,.15);color:#fff;border-color:rgba(150,187,84,.3)}

.filter.full{grid-column:1/-1}
.hero{position:relative;height:min(68vh,650px);min-height:470px;overflow:hidden;background:#08090f}

.hero-slide.active{opacity:1}

.hero-content{position:absolute;z-index:2;left:clamp(20px,6vw,90px);bottom:65px;max-width:650px}

#galeria{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:20px 0 10px}

.watch{display:inline-flex;background:var(--primary);color:#10140a;border:0;border-radius:6px;padding:6px 9px;font-size:9px;font-weight:800}

@media(min-width:600px){#galeria{grid-template-columns:repeat(4,minmax(0,1fr))}}

@media(hover:none){.card,.mini-card,.card-poster{transition:none!important}.hover-panel{transform:none;position:absolute;padding:0;background:none;bottom:7px}.synopsis,.hover-panel .watch{display:none}.card:active{transform:scale(.98)}}
@media(max-width:600px){header{background:rgba(15,18,25,.97)}.hero-slide:after{background:linear-gradient(0deg,rgba(18,22,27,.94) 0%,rgba(18,22,27,.28) 72%),linear-gradient(90deg,rgba(18,22,27,.82),transparent 70%)}}

/* Cambio suave de catálogo: evita que las tarjetas aparezcan de golpe */
#galeria.catalog-transition{opacity:.45;transform:translateY(2px);transition:opacity .28s ease,transform .28s ease}
#galeria.catalog-ready{opacity:1;transform:translateY(0);transition:opacity .42s cubic-bezier(.22,.61,.36,1),transform .42s cubic-bezier(.22,.61,.36,1)}
#galeria.catalog-ready .card{animation:cardIn .34s cubic-bezier(.22,.61,.36,1) both}.catalog-ready .card:nth-child(2n){animation-delay:.018s}.catalog-ready .card:nth-child(3n){animation-delay:.036s}
@keyframes cardIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
@media(prefers-reduced-data:reduce){.hero{min-height:360px}}

.card-meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

<body>

<script>
const CONFIG={mobile:24,desktop:48,wide:64,slide:6000,searchDebounce:180};
const state={peliculas:[],peliculasFiltradas:[],paginaActual:1,porPagina:window.innerWidth>=1600?CONFIG.wide:window.innerWidth>=900?CONFIG.desktop:CONFIG.mobile,generoActivo:"todos",anioActivo:"todos",orden:"default",sliderIndex:0,sliderInterval:null};
const $=id=>document.getElementById(id);
let menuScrollY=0;

const DOM={galeria:$("galeria"),buscador:$("buscador"),menu:$("menu"),overlay:$("overlay"),hero:$("hero-container"),heroWrapper:$("hero-wrapper"),dots:$("hero-dots"),years:$("filtroAnios"),prev:$("anterior"),next:$("siguiente"),indicator:$("indicadorPaginas")};
const norm=s=>String(s??"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const debounce=(fn,d)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),d)}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const arr=v=>Array.isArray(v)?v:(v?[v]:[]);
function valoresCampo(v){
  if(Array.isArray(v)) return v.flatMap(valoresCampo);
  if(v==null) return [];
  return String(v).split(/[,;|/]+/).map(norm).map(x=>x.trim()).filter(Boolean);
}
function textoCampos(p){
  return [p.titulo,p.tipo,p.categoria,p.genero,p.generos,p.genre,p.genres,p.tags,p.tag,p.url,
    p.descripcion,p.sinopsis,p.overview,p.resumen].flatMap(valoresCampo).join(" ");
}
function esAnime(p){
  // La categoría anime se determina solo por campos de clasificación o URL.
  // No usamos sinopsis/descripción para evitar que una película normal que
  // mencione "anime" termine dentro del filtro Animes.
  const directos=[
    ...valoresCampo(p.tipo),...valoresCampo(p.categoria),
    ...valoresCampo(p.genero),...valoresCampo(p.generos),
    ...valoresCampo(p.genre),...valoresCampo(p.genres),
    ...valoresCampo(p.tags),...valoresCampo(p.tag)
  ];
  const aliases=["anime","animes","anime series","anime movie","anime pelicula","animacion japonesa","japanese animation","japanese anime"];
  if(directos.some(x=>aliases.includes(x))) return true;
  return /(^|[\/_-])(anime|animes)([\/?&=-]|$)/.test(norm(p.url));
}

function tipo(p){
  const u=norm(p.url);
  if(esAnime(p)) return "animes";
  const campos=[...valoresCampo(p.tipo),...valoresCampo(p.categoria)];
  const series=["serie","series","tv","tv series","serie de tv","serie tv","show","television","television series"];
  if(campos.some(x=>series.includes(x)) || /(^|[\/_-])series?([\/?&=-]|$)/.test(u)) return "series";
  return "peliculas";
}

function generosNorm(p){
  return [...valoresCampo(p.genero),...valoresCampo(p.generos),...valoresCampo(p.genre),...valoresCampo(p.genres)];
}
function generoCoincide(p,g){
  const aliases={
    "ciencia ficcion":["ciencia ficcion","sci-fi","science fiction","ciencia-ficcion"],
    "suspenso":["suspenso","thriller"],"terror":["terror","horror"],
    "fantasia":["fantasia","fantasy"],"accion":["accion","action"],
    "aventura":["aventura","adventure"],"comedia":["comedia","comedy"],
    "crimen":["crimen","crime"],"drama":["drama"],"misterio":["misterio","mystery"],
    "romance":["romance","romantico","romantic"],"kdrama":["k-drama","kdrama","coreano","korean drama"]
  };
  const buscados=aliases[g]||[g];
  return p._genresNorm.some(x=>buscados.includes(x)||buscados.some(a=>x===a||x.startsWith(a+" ")||x.endsWith(" "+a)));
}
function extraerAnio(v){
  const m=String(v??"").match(/(?:19|20)\d{2}/);
  return m?m[0]:"";
}
function quality(p){
  const s=norm([p.calidad,p.quality,p.resolucion,p.titulo,p.descripcion].filter(Boolean).join(" "));
  if(s.includes("4k")||s.includes("2160"))return"4K";
  if(s.includes("1080")||s.includes("full hd")||s.includes("fhd"))return"FULL HD";
  if(s.includes("720")||s.includes("hd"))return"HD";
  return"HD";
}
function idiomaInfo(p){
  const original=String(p.idioma||p.language||p.lang||p.audio||"").trim();
  const raw=norm(original);
  const tokens=raw.split(/[\s,;\/|_-]+/).filter(Boolean);
  const incluye=a=>tokens.includes(a)||raw===a;
  if(incluye("es")||incluye("spa")||incluye("esp")||raw.includes("espanol")||raw.includes("castellano"))return["🇪🇸","Español"];
  if(incluye("en")||incluye("eng")||raw.includes("ingles")||raw.includes("english"))return["🇺🇸","Inglés"];
  if(incluye("ja")||incluye("jp")||incluye("jpn")||raw.includes("japones")||raw.includes("japanese"))return["🇯🇵","Japonés"];
  if(incluye("ko")||incluye("kor")||raw.includes("coreano")||raw.includes("korean"))return["🇰🇷","Coreano"];
  if(incluye("fr")||incluye("fra")||incluye("fre")||raw.includes("frances")||raw.includes("french"))return["🇫🇷","Francés"];
  if(incluye("de")||incluye("ger")||incluye("deu")||raw.includes("aleman")||raw.includes("german"))return["🇩🇪","Alemán"];
  if(incluye("it")||incluye("ita")||raw.includes("italiano")||raw.includes("italian"))return["🇮🇹","Italiano"];
  if(incluye("pt")||incluye("por")||raw.includes("portugues")||raw.includes("portuguese"))return["🇧🇷","Portugués"];
  if(incluye("zh")||incluye("chi")||incluye("zho")||raw.includes("chino")||raw.includes("chinese")||raw.includes("mandarin"))return["🇨🇳","Chino"];
  if(original)return["🌐",original];
  return["🌐","Idioma"];
}
function synopsis(p){
  return p.sinopsis||p.descripcion||p.overview||p.resumen||"Disfruta este título en CineStream.";
}
async function cargarDatos(){
  try{
    const r=await fetch("sources.json");if(!r.ok)throw Error("No se pudo cargar sources.json");
    const index=await r.json();if(!Array.isArray(index.sources))throw Error("sources.json no contiene sources");
    const data=await Promise.all(index.sources.map(u=>fetch(u).then(x=>x.ok?x.json():[]).catch(()=>[])));
    state.peliculas=data.flat().filter(p=>p&&p.titulo).map(p=>{
      const genres=generosNorm(p), title=norm(p.titulo), desc=norm(p.descripcion||p.sinopsis||p.overview||p.resumen);
      const tipoCalculado=tipo(p), year=extraerAnio(p.fecha||p.anio||p.year);
      return {...p,_tipoCalculado:tipoCalculado,_key:String(p.id??p.url??p.titulo),
        _genresNorm:genres,_year:year,_searchText:norm([title,desc,textoCampos(p),tipoCalculado].join(" "))};
    });
    if(!state.peliculas.length)throw Error("No hay títulos disponibles");
    configurarBanner();generarAnios();configurarScrollAnios();filtrar();
  }catch(e){DOM.galeria.innerHTML=`<div class="empty"><h3>No se pudo cargar el catálogo</h3><p>${esc(e.message)}</p><button class="page-btn" onclick="location.reload()" style="margin-top:15px">Reintentar</button></div>`;DOM.indicator.textContent="Error de carga"}
}
function configurarBanner(){
  const list=state.peliculas.filter(p=>p.banner).sort(()=>Math.random()-.5).slice(0,8);
  const slides=list.length?list:state.peliculas.slice(0,5);
  DOM.heroWrapper.innerHTML="";DOM.dots.innerHTML="";
  slides.forEach((p,i)=>{
    const s=document.createElement("div");s.className="hero-slide "+(i?"":"active");s.dataset.bg=p.banner||p.imagen||"";if(i===0)s.style.backgroundImage=`url("${s.dataset.bg}")`;
    s.innerHTML=`<div class="hero-content"><span class="hero-kicker">🔥 Estreno ${esc(p.fecha||"")}</span><h1>${esc(p.titulo)}</h1><div class="hero-meta"><span>${esc(arr(p.genero)[0]||"Cine")}</span><span>•</span><span>${esc(p.duracion||"Disponible ahora")}</span><span>•</span><span>${quality(p)}</span></div><p class="hero-desc">${esc(synopsis(p))}</p><a class="hero-btn" href="${esc(p.url||"#")}">▶ Ver ahora</a></div>`;
    DOM.heroWrapper.appendChild(s);const d=document.createElement("button");d.className="dot "+(i?"":"active");d.onclick=()=>slideTo(i);DOM.dots.appendChild(d);
  });
  clearInterval(state.sliderInterval);if(slides.length>1)state.sliderInterval=setInterval(()=>slideTo((state.sliderIndex+1)%slides.length),CONFIG.slide);
}
function slideTo(i){state.sliderIndex=i;document.querySelectorAll(".hero-slide").forEach((x,n)=>{if(n===i&&!x.style.backgroundImage&&x.dataset.bg)x.style.backgroundImage=`url("${x.dataset.bg}")`;x.classList.toggle("active",n===i)});document.querySelectorAll(".dot").forEach((x,n)=>x.classList.toggle("active",n===i))}
function miniCard(p){
  return `<a class="mini-card" href="${esc(p.url||"#")}"><img loading="lazy" decoding="async" src="${esc(p.imagen||"")}" alt="${esc(p.titulo)}" onerror="this.style.display='none'"><div class="mini-info"><b>${esc(p.titulo)}</b><small>${esc(p.fecha||"")} • ${esc(idiomaInfo(p)[0])} ${esc(idiomaInfo(p)[1])} • ${quality(p)}</small></div></a>`;
}
function generarAnios(){
  const years=[...new Set(state.peliculas.map(p=>p._year).filter(Boolean))].sort((a,b)=>Number(b)-Number(a));
  DOM.years.innerHTML=`<button class="year active" data-anio="todos">Todos</button>`+years.map(y=>`<button class="year" data-anio="${esc(y)}">${esc(y)}</button>`).join("");
  DOM.years.querySelectorAll(".year").forEach(b=>b.onclick=()=>{DOM.years.querySelectorAll(".year").forEach(x=>x.classList.remove("active"));b.classList.add("active");state.anioActivo=b.dataset.anio;filtrar()});
}

function configurarScrollAnios(){
  const el=DOM.years;if(el.dataset.dragReady)return;el.dataset.dragReady="1";
  let down=false,startX=0,startScroll=0,moved=false;
  el.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse"&&e.button!==0)return;down=true;moved=false;startX=e.clientX;startScroll=el.scrollLeft;el.classList.add("dragging");el.setPointerCapture?.(e.pointerId)});
  el.addEventListener("pointermove",e=>{if(!down)return;const dx=e.clientX-startX;if(Math.abs(dx)>4)moved=true;el.scrollLeft=startScroll-dx});
  const end=e=>{if(!down)return;down=false;el.classList.remove("dragging");try{el.releasePointerCapture?.(e.pointerId)}catch(_) {}};
  el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);
  el.addEventListener("click",e=>{if(moved){e.preventDefault();e.stopPropagation()}},true);
  el.addEventListener("wheel",e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){const before=el.scrollLeft;el.scrollLeft+=e.deltaY;if(el.scrollLeft!==before)e.preventDefault()}},{passive:false});
}
function filtrar(){
  const q=norm(DOM.buscador.value.trim());
  state.peliculasFiltradas=state.peliculas.filter(p=>{
    const text=!q||p._searchText.includes(q);
    const year=state.anioActivo==="todos"||p._year===String(state.anioActivo);
    const gen=state.generoActivo==="todos"
      ? true
      : ["peliculas","series","animes"].includes(state.generoActivo)
        ? p._tipoCalculado===state.generoActivo
        : generoCoincide(p,state.generoActivo);
    return text&&year&&gen;
  });
  if(state.orden==="recent")state.peliculasFiltradas.sort((a,b)=>Number(b._year||0)-Number(a._year||0));
  if(state.orden==="az")state.peliculasFiltradas.sort((a,b)=>norm(a.titulo).localeCompare(norm(b.titulo)));
  if(state.orden==="za")state.peliculasFiltradas.sort((a,b)=>norm(b.titulo).localeCompare(norm(a.titulo)));
  state.paginaActual=1;
  const searching=!!q||state.generoActivo!=="todos"||state.anioActivo!=="todos";
  DOM.hero.style.display=searching?"none":"block";
  $("catalogTitle").textContent=state.generoActivo==="todos"?"Catálogo":state.generoActivo.charAt(0).toUpperCase()+state.generoActivo.slice(1);
  renderCards();
}
function renderCards(){
  const start=(state.paginaActual-1)*state.porPagina;
  const list=state.peliculasFiltradas.slice(start,start+state.porPagina);

  DOM.galeria.classList.remove("catalog-ready");
  DOM.galeria.classList.add("catalog-transition");

  requestAnimationFrame(()=>{
    if(!list.length){
      DOM.galeria.innerHTML=`<div class="empty"><h3>No se encontraron resultados</h3><p>Prueba otro término o filtro.</p></div>`;
    }else{
      DOM.galeria.innerHTML=list.map((p,i)=>{
        const q=quality(p),lang=idiomaInfo(p),genres=arr(p.genero).slice(0,2).join(" • ");
        return `<article class="card">
          <a href="${esc(p.url||"#")}"><div class="card-top"><div class="badges"><span class="badge primary">${esc(p.fecha||"")}</span><span class="badge hd">${q}</span><span class="badge lang">${lang[0]} ${esc(lang[1])}</span></div></div><img class="card-poster" src="${esc(p.imagen||"")}" loading="lazy" decoding="async" alt="${esc(p.titulo)}" onerror="this.style.opacity=.25">
          <div class="card-info"><div class="card-title">${esc(p.titulo)}</div><div class="card-meta"><span>${lang[0]} ${esc(lang[1])}</span><span>${esc(genres||p._tipoCalculado)}</span></div></div>
          <div class="hover-panel"><b>${esc(p.titulo)}</b><div class="synopsis">${esc(synopsis(p))}</div><span class="watch">▶ Ver ahora</span></div></a>
        </article>`;
      }).join("");
    }

    requestAnimationFrame(()=>{
      DOM.galeria.classList.remove("catalog-transition");
      DOM.galeria.classList.add("catalog-ready");
      actualizarPag();
    });
  });
}
function actualizarPag(){const total=Math.max(1,Math.ceil(state.peliculasFiltradas.length/state.porPagina));DOM.indicator.textContent=`Página ${state.paginaActual} de ${total}`;DOM.prev.disabled=state.paginaActual<=1;DOM.next.disabled=state.paginaActual>=total}
function cambiarPagina(d){const total=Math.ceil(state.peliculasFiltradas.length/state.porPagina),n=state.paginaActual+d;if(n>=1&&n<=total){state.paginaActual=n;renderCards();scrollTo({top:document.querySelector(".toolbar").offsetTop-75,behavior:"auto"})}}
function setGenero(g){
  state.generoActivo=norm(g);document.querySelectorAll(".filter,.desktop-nav button").forEach(x=>x.classList.toggle("active",norm(x.dataset.genero)===state.generoActivo));
  $("menu").classList.remove("active");$("overlay").classList.remove("active");document.body.classList.remove("menu-open");filtrar();
}
$("btnMenu").onclick=()=>{
  menuScrollY=window.scrollY||window.pageYOffset;
  $("menu").classList.add("active");
  $("overlay").classList.add("active");
  document.body.classList.add("menu-open");
  document.body.style.top=`-${menuScrollY}px`;
};
const closeMenu=()=>{
  $("menu").classList.remove("active");
  $("overlay").classList.remove("active");
  document.body.classList.remove("menu-open");
  document.body.style.top="";
  window.scrollTo(0,menuScrollY);
};
$("btnCerrarMenu").onclick=closeMenu;$("overlay").onclick=closeMenu;
document.querySelectorAll(".filter,.desktop-nav button").forEach(b=>b.onclick=()=>setGenero(b.dataset.genero));
$("buscador").addEventListener("input",debounce(filtrar,CONFIG.searchDebounce));
$("sortSelect").onchange=e=>{state.orden=e.target.value;filtrar()};
$("anterior").onclick=()=>cambiarPagina(-1);$("siguiente").onclick=()=>cambiarPagina(1);
window.addEventListener("resize",debounce(()=>{const n=innerWidth>=1600?CONFIG.wide:innerWidth>=900?CONFIG.desktop:CONFIG.mobile;if(n!==state.porPagina){state.porPagina=n;state.paginaActual=1;renderCards()}},200));
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu();if(e.key==="ArrowLeft"&&!DOM.prev.disabled)cambiarPagina(-1);if(e.key==="ArrowRight"&&!DOM.next.disabled)cambiarPagina(1)});
cargarDatos();
</script>
</body>
</html>
