<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Estoy pensando en dejarlo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary:#8fbf52; --primary2:#add66d; --bg:#202a35; --surface:#2a3541; --surface2:#323e4b;
      --bg-dark:var(--bg); --bg-card:var(--surface); --accent:var(--primary); --text-main:#f3f6f8;
      --muted:#aeb9c5; --line:rgba(255,255,255,.13); --glass:rgba(31,41,52,.96);
      --transition-fast:all .25s ease; --transition-menu:transform .22s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background:var(--bg); color:var(--text-main); overflow-x:hidden; text-align:center; }
    body.menu-open { overflow:hidden; position:fixed; width:100%; }

    header {
      position:sticky; top:0; z-index:1100; height:72px; padding:0 clamp(18px,4vw,64px);
      display:flex; align-items:center; gap:20px; background:rgba(29,38,48,.97);
      backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
    }
    .logo-link { text-decoration:none; color:var(--text-main); font-weight:800; font-size:20px; display:none; }
    @media (min-width:768px){.logo-link{display:block}}

    #menu { position:fixed; top:0; left:0; width:330px; max-width:90vw; height:100dvh;
      transform:translate3d(-105%,0,0); background:#27333f; z-index:2000; padding:24px;
      transition:transform .22s ease; overflow-y:auto; overflow-x:hidden; text-align:left;
      border-right:1px solid var(--line); box-shadow:8px 0 30px rgba(0,0,0,.28);
      scrollbar-width:none; -ms-overflow-style:none; }
    #menu::-webkit-scrollbar { display:none; width:0; height:0; }
    #menu.active { transform:translate3d(0,0,0); }
    #menu.active { left: 0; }
    #overlay { position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:1900;
      opacity:0; visibility:hidden; transition:opacity .18s ease; }
    #overlay.active { opacity:1; visibility:visible; }
    .filtro:hover { background: var(--primary); color: #000; font-weight: 700; }
    .filtro-full { grid-column: 1 / -1; }

    .menu-head {
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      margin-bottom:28px; color:var(--text-main);
    }
    .menu-head strong { font-size:21px; font-weight:800; }
    .menu-head .close {
      width:38px; height:38px; border:1px solid var(--line); border-radius:10px;
      background:var(--surface); color:var(--text-main); font-size:25px; line-height:1; cursor:pointer;
    }
    .menu-head .close:hover { background:var(--primary); color:#000; }

    .section-label {
      color:var(--muted); font-size:13px; font-weight:700; text-transform:uppercase;
      letter-spacing:.8px; margin:22px 0 10px;
    }
    .filter-grid {
      display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px;
    }
    .filter {
      width:100%; min-height:45px; padding:10px 8px;
      border:1px solid var(--line); border-radius:10px;
      background:var(--surface); color:var(--text-main);
      font-family:'Inter',sans-serif; font-size:14px; font-weight:600;
      cursor:pointer; transition:.2s ease;
    }
    .filter:hover, .filter.active {
      background:var(--primary); color:#101510; border-color:var(--primary);
    }
    .filter.full { grid-column:1 / -1; }

    .header-action {
      width:42px; height:42px; flex:0 0 42px;
      display:flex; align-items:center; justify-content:center;
      border:1px solid var(--line); border-radius:10px;
      background:var(--surface); color:var(--text-main);
      font-size:22px; cursor:pointer;
    }
    .header-action:hover { background:var(--primary); color:#000; }

    .search-container { flex:1; max-width:650px; }
    .buscador {
      width:100%; height:42px; padding:0 15px;
      border:1px solid var(--line); border-radius:10px;
      background:var(--surface); color:var(--text-main); outline:none;
      font-family:'Inter',sans-serif; font-size:16px;
    }
    .buscador::placeholder { color:var(--muted); }
    .buscador:focus {
      border-color:var(--primary);
      box-shadow:0 0 0 3px rgba(143,191,82,.15);
    }

    @media (max-width:767px) {
      header { height:72px; padding:0 14px; gap:10px; }
      .search-container { max-width:none; }
      .buscador { height:42px; font-size:16px; }
      #menu { width:300px; max-width:82vw; padding:20px; }
      .filter-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
      .filter { min-height:42px; font-size:13px; }
    }

    .main-container { display: flex; flex-direction: column; align-items: center; padding: 20px 4% 50px; width: 100%; }
    h1 { font-size: clamp(1.4rem, 5vw, 2.2rem); font-weight: 800; margin-bottom: 20px; background: linear-gradient(to right, #fff, var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .selector-container { width: 100%; max-width: 300px; margin-bottom: 25px; position: relative; }
    .custom-select { position: relative; width: 100%; }
    .select-trigger {
        width: 100%; padding: 12px; background: var(--surface); border: 1px solid var(--line);
        color: white; border-radius: 12px; font-weight: 700; font-size: 0.9rem;
        display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.3s;
    }
    .select-trigger:after { content: '▼'; font-size: 0.7rem; color: var(--primary); margin-left: 10px; transition: 0.3s; }
    .custom-select.active .select-trigger:after { transform: rotate(180deg); }

    .select-options {
        position: absolute; top: 110%; left: 0; width: 100%;
        background: var(--surface2); border: 1px solid var(--primary); border-radius: 12px;
        z-index: 1000; overflow: hidden; max-height: 0; opacity: 0; pointer-events: none;
        transition: max-height 0.4s ease, opacity 0.3s ease;
    }
    .custom-select.active .select-options { max-height: 400px; opacity: 1; pointer-events: auto; }
    .option-item { width: 100%; padding: 14px; background: none; border: none; color: white; text-align: center; cursor: pointer; font-size: 0.9rem; border-bottom: 1px solid var(--glass); }
    .option-item:hover { background: var(--primary); color: black; }

    .player-wrapper { 
      width: 100%; max-width: 1100px; background: #000; position: relative; 
      box-shadow: 0 20px 50px rgba(0,0,0,0.8); margin: 0 auto 40px; 
      border-radius: 12px; overflow: hidden; border: 1px solid var(--glass); 
    }
    .iframe-container { position: relative; width: 100%; padding-bottom: 90%; height: 0; display: none; }

    @media (min-width: 1024px) {
      header {
        position: relative;
        top: auto;
      }

      .main-container {
        padding-top: 30px;
      }

      .player-wrapper {
        width: 100%;
        max-width: min(1100px, calc(100vw - 8vw));
        margin-left: auto;
        margin-right: auto;
      }

      .iframe-container {
        width: 100%;
        height: auto;
        padding-bottom: 0;
        aspect-ratio: 16 / 9;
      }

      .iframe-container iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    }
    .iframe-container.active { display: block; }
    .iframe-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; display: block; }

    .relacionadas-container { width: 100%; max-width: 1100px; text-align: left; margin-top: 20px; }
    .seccion-titulo { font-size: 0.9rem; font-weight: 700; color: var(--primary); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; text-transform: uppercase; }
    .seccion-titulo::after { content: ""; flex: 1; height: 1px; background: var(--glass); }
    .grid-relacionadas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    @media (min-width: 1024px) { .grid-relacionadas { grid-template-columns: repeat(6, 1fr); gap: 20px; } }
    .card-mini { background: var(--surface); border-radius: 8px; overflow: hidden; text-decoration: none; border: 1px solid var(--glass); position: relative; transition: 0.3s; display: block;}
    .card-mini img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
    .info-mini { padding: 8px 5px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); position: absolute; bottom: 0; width: 100%; }
    .info-mini h5 { color: #fff; font-size: 0.65rem; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>

<header>
  <button id="btnMenu" class="header-action" aria-label="Abrir menú">☰</button>
  <a href="../index.html" class="logo-link">CineStream</a>
  <div class="search-container">
    <input type="search" id="buscador" class="buscador" placeholder="Buscar...">
  </div>
</header>

<div id="overlay"></div>

<nav id="menu"></nav>
<script src="../menu.js"></script>

<main class="main-container">
  <h1>Estoy pensando en dejarlo</h1>

  <div class="selector-container">
    <div class="custom-select" id="serverSelect">
      <div class="select-trigger" onclick="toggleSelect()"><span id="currentServerLabel">SERVER 1</span></div>
      <div class="select-options">
        <button class="option-item" onclick="cambiarServer(1, 'SERVER 1')">SERVER 1</button>
        <button class="option-item" onclick="cambiarServer(2, 'SERVER 2')">SERVER 2</button>
        <button class="option-item" onclick="cambiarServer(3, 'SERVER 3')">SERVER 3</button>
      </div>
    </div>
  </div>

  <div class="player-wrapper">
    <div class="iframe-container active" id="server1">
      <iframe src="https://embed69.org/f/tt7939766" scrolling="yes" allow="autoplay; encrypted-media" referrerpolicy="no-referrer" allowfullscreen></iframe>
    </div>
    <div class="iframe-container" id="server2">
      <iframe src="https://fastream.to/embed-ewozjwwkb9oh.html" allow="autoplay; encrypted-media" referrerpolicy="no-referrer" allowfullscreen></iframe>
    </div>
    <div class="iframe-container" id="server3">
      <iframe src="https://xupalace.org/video/tt7939766/" scrolling="yes" allow="autoplay; encrypted-media" referrerpolicy="no-referrer" allowfullscreen></iframe>
    </div>
  </div>

  <div class="relacionadas-container">
    <div class="seccion-titulo">Recomendados para ti</div>
    <div class="grid-relacionadas" id="relacionadas-box"></div>
  </div>
</main>

<script>
  // BUSCADOR ENLAZADO AL INDEX
  document.getElementById('buscador').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') {
      const q = e.target.value.trim();
      if (q) window.location.href = `../index.html?search=${encodeURIComponent(q)}`;
    }
  });

  // SELECTOR SERVIDORES
  function toggleSelect() { 
    document.getElementById('serverSelect').classList.toggle('active'); 
  }
  
  function cambiarServer(num, label) {
    document.getElementById('currentServerLabel').innerText = label;
    document.getElementById('serverSelect').classList.remove('active');
    
    document.querySelectorAll('.iframe-container').forEach(cont => {
      cont.classList.remove('active');
      const ifr = cont.querySelector('iframe');
      if (ifr && !ifr.getAttribute('data-src')) {
        ifr.setAttribute('data-src', ifr.src);
      }
      if (ifr) ifr.src = "about:blank"; 
    });
    
    const activo = document.getElementById('server' + num);
    if (activo) {
      activo.classList.add('active');
      const ifrActivo = activo.querySelector('iframe');
      if (ifrActivo) {
        ifrActivo.src = ifrActivo.getAttribute('data-src');
      }
    }
  }

  // MENÚ COMPARTIDO: menu.js genera las órdenes y sus enlaces al index.
  const menu = document.getElementById('menu');
  const overlay = document.getElementById('overlay');
  const btnMenu = document.getElementById('btnMenu');
  let menuScrollY = 0;

  btnMenu.onclick = () => {
    menuScrollY = window.scrollY || window.pageYOffset;
    menu.classList.add('active');
    overlay.classList.add('active');
    document.body.classList.add('menu-open');
    document.body.style.top = `-${menuScrollY}px`;
  };

  const closeMenu = () => {
    menu.classList.remove('active');
    overlay.classList.remove('active');
    document.body.classList.remove('menu-open');
    document.body.style.top = '';
    window.scrollTo(0, menuScrollY);
  };

  overlay.onclick = closeMenu;
  document.addEventListener('click', e => { if (e.target.id === 'btnCerrarMenu') closeMenu(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });

  // RECOMENDADOS - AHORA CON ARCHIVO ÍNDICE
  async function cargarRelacionadas() {
    const contenedor = document.getElementById('relacionadas-box');
    
    try {
      // 1. Cargar el índice de fuentes (sources.json)
      const indexResponse = await fetch('../sources.json');
      if (!indexResponse.ok) throw new Error('No se encontró sources.json');
      
      const index = await indexResponse.json();
      
      // 2. Cargar todos los JSONs listados automáticamente
      const responses = await Promise.all(
        index.sources.map(ruta => 
          fetch(`../${ruta}`)
            .then(res => res.ok ? res.json() : [])
            .catch(() => []) // Si falla uno, continúa con los demás
        )
      );
      
      // 3. Combinar todos los datos
      const data = responses.flat().filter(item => item && item.titulo); // Filtrar vacíos
      
      // 4. Mezclar aleatoriamente y tomar 6
      const esPC = window.innerWidth >= 1024;
      const cantidad = esPC ? 6 : 6;
      const seleccion = data.sort(() => 0.5 - Math.random()).slice(0, cantidad);
      
      // 5. Renderizar
      if (seleccion.length === 0) {
        contenedor.innerHTML = '<p style="color:#666;font-size:0.8rem;text-align:center;">No hay recomendaciones disponibles</p>';
        return;
      }
      
      contenedor.innerHTML = seleccion.map(p => `
        <a href="../${p.url}" class="card-mini">
          <img src="${p.imagen}" loading="lazy" alt="${p.titulo}">
          <div class="info-mini"><h5>${p.titulo}</h5></div>
        </a>
      `).join('');
      
    } catch (e) {
      console.error('Error cargando contenido:', e);
      contenedor.innerHTML = '<p style="color:#666;font-size:0.8rem;text-align:center;">Error al cargar recomendaciones</p>';
    }
  }

  // Cerrar select al hacer click fuera
  document.addEventListener('click', (e) => {
    const select = document.getElementById('serverSelect');
    if (!select.contains(e.target)) {
      select.classList.remove('active');
    }
  });

  window.addEventListener('DOMContentLoaded', cargarRelacionadas);
</script>

</body>
</html>
