<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>El Hombre Vapor</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #8fbf52;
      --primary2: #add66d;
      --bg-dark: #202a35;
      --bg-card: #2a3541;
      --surface2: #323e4b;
      --accent: #8fbf52;
      --text-main: #f3f6f8;
      --muted: #aeb9c5;
      --line: rgba(255,255,255,.13);
      --glass: rgba(31,41,52,.96);
      --transition: all 0.25s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); overflow-x: hidden; text-align: center; }

    /* HEADER */
    header {
      position: sticky; top: 0; z-index: 1100;
      background: rgba(29,38,48,.97); backdrop-filter: blur(15px);
      padding: 10px 4%; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line);
    }
    .logo-link { text-decoration: none; color: var(--primary); font-weight: 800; font-size: 1.2rem; display: none; }
    @media (min-width: 768px) { .logo-link { display: block; } }

    .search-container { flex: 1; }
    .buscador {
      width: 100%; background: var(--glass); border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 20px; border-radius: 50px; color: white; outline: none; font-size: 15px;
    }

    /* MENU LATERAL */
    #menu { 
      position: fixed; top: 0; left: -105%; width: 85%; max-width: 320px; height: 100vh; 
      background: var(--bg-card); z-index: 2000; padding: 30px 20px; transition: var(--transition); 
      overflow-y: auto; text-align: left; border-right: 1px solid var(--glass);
    }
    #menu.active { left: 0; }
    #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1500; backdrop-filter: blur(5px); }
    
    .seccion-label { font-size: 0.7rem; color: var(--primary); font-weight: 800; text-transform: uppercase; margin: 25px 0 15px 5px; letter-spacing: 1.5px; opacity: 0.7; }
    .grid-filtros { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .filtro { padding: 12px; background: var(--glass); border-radius: 8px; color: #eee; text-decoration: none; display: block; font-size: 0.8rem; transition: 0.3s; text-align: center; }
    .filtro:hover { background: var(--primary); color: #000; }
    .filtro-full { grid-column: 1 / -1; }

    /* TITULO ORIGINAL */
    .main-container { display: flex; flex-direction: column; align-items: center; padding: 15px 4% 50px; width: 100%; }
    h1#titulo_display { 
        font-size: clamp(1.1rem, 4vw, 1.8rem); font-weight: 800; margin-bottom: 15px;
        background: linear-gradient(to right, #fff, var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    /* PLAYER (ESTILOS COPIADOS DE 465.HTML) */
    .player-wrapper { 
      width: 100%; max-width: 1100px; background: #000; position: relative; 
      box-shadow: 0 20px 50px rgba(0,0,0,0.8); margin: 0 auto; 
      border-radius: 12px; overflow: hidden; border: 1px solid var(--glass); 
    }
    
    /* Móvil / Android */
    .iframe-container { position: relative; width: 100%; padding-bottom: 90%; height: 0; }

    /* PC: Proporción 16:9 exacta */
    @media (min-width: 1024px) {
      .iframe-container {
        width: 100%;
        height: auto;
        padding-bottom: 0;
        aspect-ratio: 16 / 9;
      }

      .iframe-container iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    }

    .iframe-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; display: none; }

    /* SELECTORES LADO A LADO */
    .selector-container { 
        width: 100%; max-width: 1100px; margin: 15px 0; 
        display: flex; flex-direction: row; gap: 10px; 
    }
    .custom-select { position: relative; flex: 1; }
    .select-trigger {
        width: 100%; padding: 14px; background: var(--bg-card); border: 1px solid var(--glass);
        color: white; border-radius: 10px; font-weight: 700; font-size: 0.85rem;
        display: flex; justify-content: center; align-items: center; cursor: pointer;
    }
    .select-trigger:after { content: '▼'; font-size: 0.6rem; color: var(--primary); margin-left: 8px; transition: 0.3s; }
    .custom-select.active .select-trigger:after { transform: rotate(180deg); }

    .select-options {
        display: block; position: absolute; top: 115%; left: 0; width: 100%;
        background: var(--surface2); border: 1px solid var(--primary); border-radius: 10px;
        z-index: 1000; overflow-y: auto; max-height: 200px;
        opacity: 0; visibility: hidden; transform: translateY(-10px);
        transition: var(--transition);
    }
    .custom-select.active .select-options { 
        opacity: 1; visibility: visible; transform: translateY(0);
    }
    .option-item {
        width: 100%; padding: 12px; background: none; border: none; color: white;
        text-align: center; cursor: pointer; font-size: 0.85rem; border-bottom: 1px solid var(--line);
    }
    .option-item:hover { background: var(--primary); color: black; }

    /* GRID EPISODIOS */
    .episodios-grid {
      display: grid; 
      grid-template-columns: repeat(4, 1fr); 
      gap: 8px; 
      width: 100%; 
      max-width: 1100px; 
      margin-top: 10px;
      padding: 5px;
    }

    @media (min-width: 768px) { .episodios-grid { grid-template-columns: repeat(6, 1fr); } }

    .ep-card { background: var(--bg-card); border-radius: 6px; overflow: hidden; cursor: pointer; border: 1.5px solid transparent; transition: 0.3s; }
    .ep-card.activa { border-color: var(--accent); background: rgba(143,191,82,.12); }
    .thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; pointer-events: none; }
    .ep-info { padding: 6px 2px; text-align: center; font-size: 0.65rem; font-weight: 700; }

    /* ===== CINESTREAM: ESTILOS DEL MENÚ Y BUSCADOR ===== */

    .header-action {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 10px;
      background: #121c27;
      color: #fff;
      cursor: pointer;
      transition: .2s ease;
    }

    .header-action:hover {
      background: var(--primary);
      color: #000;
    }

    .header-action svg {
      width: 23px;
      height: 23px;
    }

    .buscador {
      height: 42px;
      background: #2a3541;
      border: 1px solid rgba(255,255,255,.13);
      padding: 0 15px;
      border-radius: 10px;
      color: #fff;
      outline: none;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
    }

    .buscador::placeholder {
      color: #aeb9c5;
    }

    .buscador:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(150,187,84,.15);
    }

    #menu {
      width: 330px;
      max-width: 90vw;
      height: 100dvh;
      left: 0;
      top: 0;
      padding: 24px;
      background: #202a35;
      transform: translate3d(-105%,0,0);
      transition: transform .22s ease;
      overflow-y: auto;
      overflow-x: hidden;
      border-right: 1px solid rgba(255,255,255,.13);
      box-shadow: 8px 0 30px rgba(0,0,0,.28);
    }

    #menu.active {
      left: 0;
      transform: translate3d(0,0,0);
    }

    #overlay {
      display: block;
      opacity: 0;
      visibility: hidden;
      transition: opacity .18s ease, visibility .18s ease;
      background: rgba(0,0,0,.72);
      backdrop-filter: none;
    }

    #overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .menu-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 25px;
      color: #fff;
    }

    .menu-head strong {
      font-size: 21px;
      font-weight: 800;
    }

    .menu-head .close {
      width: 38px;
      height: 38px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 10px;
      background: #2a3541;
      color: #fff;
      font-size: 25px;
      line-height: 1;
      cursor: pointer;
    }

    .menu-head .close:hover {
      background: var(--primary);
      color: #000;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 9px;
    }

    .filter {
      width: 100%;
      min-height: 43px;
      padding: 10px 8px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 10px;
      background: #2a3541;
      color: #f3f6f8;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: .2s ease;
    }

    .filter:hover,
    .filter.active {
      background: var(--primary);
      color: #101510;
      border-color: var(--primary);
    }

    .filter.full {
      grid-column: 1 / -1;
    }

    /* PALETA CINESTREAM */
    .header-action {
      width:42px; height:42px; flex:0 0 42px;
      display:flex; align-items:center; justify-content:center;
      border:1px solid var(--line); border-radius:10px;
      background:var(--bg-card); color:var(--text-main); cursor:pointer;
    }
    .header-action svg { width:24px; height:24px; }
    .header-action:hover { background:var(--primary); color:#101510; }
    .buscador {
      background:var(--bg-card);
      border:1px solid var(--line);
      color:var(--text-main);
    }
    .buscador::placeholder { color:var(--muted); }
    .buscador:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(143,191,82,.15); }
    #menu {
      background:#202631;
      border-right:1px solid var(--line);
      box-shadow:8px 0 30px rgba(0,0,0,.28);
    }
    #overlay { background:rgba(0,0,0,.72); }
    .seccion-label { color:var(--muted); }
    .filtro { background:var(--bg-card); color:var(--text-main); border:1px solid var(--line); }
    .filtro:hover, .filtro:focus { background:var(--primary); color:#101510; }
    .select-trigger { background:var(--bg-card); border-color:var(--line); color:var(--text-main); }
    .select-options { background:var(--surface2); border-color:var(--primary); }
    .option-item { color:var(--text-main); border-bottom-color:var(--line); }
    .option-item:hover { background:var(--primary); color:#101510; }
    .ep-card { background:var(--bg-card); }
    .ep-card.activa { border-color:var(--primary); background:rgba(143,191,82,.12); }
    .ep-info { color:var(--text-main); }
  </style>
</head>
<body>

<header>
  <div id="btnMenu" style="cursor:pointer; padding: 5px;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M3 12h18M3 6h18M3 18h18"/></svg></div>
  <a href="../index.html" class="logo-link">CineStream</a>
  <div class="search-container">
    <input type="search" id="buscador" class="buscador" placeholder="Buscar..." onkeypress="ejecutarBusqueda(event)">
  </div>
</header>

<div id="overlay"></div>

<nav id="menu"></nav>
<script src="../menu.js"></script>

<main class="main-container">
  <h1 id="titulo_display">El Hombre Vapor</h1>

  <div class="player-wrapper">
    <div class="iframe-container" id="player-container">
        <iframe id="iframe_s1" FRAMEBORDER="0" allow="autoplay; encrypted-media" referrerpolicy="no-referrer" allowfullscreen></iframe>
        <iframe id="iframe_s2" FRAMEBORDER="0" allow="autoplay; encrypted-media" referrerpolicy="no-referrer" allowfullscreen></iframe>
        <iframe id="iframe_s3" FRAMEBORDER="0" allow="autoplay; encrypted-media" referrerpolicy="no-referrer" allowfullscreen></iframe>
        <iframe id="iframe_s4" FRAMEBORDER="0" allow="autoplay; encrypted-media" referrerpolicy="no-referrer" allowfullscreen></iframe>
    </div>
  </div>

  <div class="selector-container">
    <div class="custom-select" id="selectServer">
        <div class="select-trigger" onclick="toggleSelect('selectServer')"><span id="currentServerText">SERVER 1</span></div>
        <div class="select-options">
            <button class="option-item" onclick="cambiarServer(1, 'SERVER 1')">SERVER 1</button>
            <button class="option-item" onclick="cambiarServer(2, 'SERVER 2')">SERVER 2</button>
            <button class="option-item" onclick="cambiarServer(3, 'SERVER 3')">SERVER 3</button>
            <button class="option-item" onclick="cambiarServer(4, 'SERVER 4')">SERVER 4</button>
        </div>
    </div>
    <div class="custom-select" id="selectTemp">
        <div class="select-trigger" onclick="toggleSelect('selectTemp')"><span id="currentTempText">Temporada 1</span></div>
        <div class="select-options">
            <button class="option-item" onclick="mostrarTemporada(1, 'Temporada 1')">Temporada 1</button>
        </div>
    </div>
  </div>

  <div id="grid-episodios" class="episodios-grid"></div>
</main>

<script>
  // BUSCADOR ENLAZADO AL INDEX
  function ejecutarBusqueda(event) {
    if (event.key === 'Enter') {
      const q = document.getElementById('buscador').value.trim();
      if (q.length > 0) window.location.href = `../index.html?search=${encodeURIComponent(q)}`;
    }
  }

  // MENÚ LATERAL
  const menu = document.getElementById('menu'), overlay = document.getElementById('overlay'), btnMenu = document.getElementById('btnMenu');
  btnMenu.onclick = () => {
    menu.classList.add('active');
    overlay.classList.add('active');
    document.body.style.overflow = 'hidden';
  };
  overlay.onclick = () => {
    menu.classList.remove('active');
    overlay.classList.remove('active');
    document.body.style.overflow = '';
  };

  document.addEventListener('click', (e) => {
    if (e.target.id === 'btnCerrarMenu') {
      menu.classList.remove('active');
      overlay.classList.remove('active');
      document.body.style.overflow = '';
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      menu.classList.remove('active');
      overlay.classList.remove('active');
      document.body.style.overflow = '';
    }
  });

  let tActual = 1, sActual = 1, epSeleccionadoIdx = 0;

  const seriesDB = {
    1: [
         { n: 1, t: "https://i.postimg.cc/CLZmhskr/Human-1x1.jpg", s1: "https://embed69.org/f/tt33083249-1x01", s2: "https://morencius.com/embed/nyiklo6hqir4", s3: "https://vidsonic.net/e/b58knxs8rb3m", s4: "https://luluvid.com/e/vfpnt7wxhjoy" },
         { n: 2, t: "https://i.postimg.cc/Hsf3V89P/Human-1x2.jpg", s1: "https://embed69.org/f/tt33083249-1x02", s2: "https://morencius.com/embed/aemlbhx2koxr", s3: "https://vidsonic.net/e/qb738j9h9qrl", s4: "https://luluvid.com/e/81sl1huovt3a" },
         { n: 3, t: "https://i.postimg.cc/m20Vt1Sf/Human-1x3.jpg", s1: "https://embed69.org/f/tt33083249-1x03", s2: "https://morencius.com/embed/r7vmk20rpeau", s3: "https://vidsonic.net/e/ev7befipwnfh", s4: "https://luluvid.com/e/h6bbelna2kng" },
         { n: 4, t: "https://i.postimg.cc/nc6TC91x/Human-1x4.jpg", s1: "https://embed69.org/f/tt33083249-1x04", s2: "https://morencius.com/embed/xvhfr6k44tgd", s3: "https://vidsonic.net/e/vmi1r94xyehb", s4: "https://luluvid.com/e/rdvc4dqj0bjq" },
         { n: 5, t: "https://i.postimg.cc/dVr6dQWd/Human-1x5.jpg", s1: "https://embed69.org/f/tt33083249-1x05", s2: "https://morencius.com/embed/kyswefc6l3rb", s3: "https://vidsonic.net/e/2vzziky9tijo", s4: "https://luluvid.com/e/zrmm61zqvujx" },
         { n: 6, t: "https://i.postimg.cc/zGK7WDdh/Human-1x6.jpg", s1: "https://embed69.org/f/tt33083249-1x06", s2: "https://morencius.com/embed/7cz4lsk8ugrj", s3: "https://vidsonic.net/e/xmfv1np2h6ke", s4: "https://luluvid.com/e/qsn9247qnnct" }, 
         { n: 7, t: "https://i.postimg.cc/KYbN5XVM/Human-1x7.jpg", s1: "https://embed69.org/f/tt33083249-1x07", s2: "https://morencius.com/embed/340mthlmbrz2", s3: "https://vidsonic.net/e/7kj1s4qv2cnn", s4: "https://luluvid.com/e/lvwg9su9c8k0" },
         { n: 8, t: "https://i.postimg.cc/HLm2tGKM/Human-1x8.jpg", s1: "https://embed69.org/f/tt33083249-1x08", s2: "https://morencius.com/embed/oiu84uiz3qnd", s3: "https://vidsonic.net/e/7992ge37vsgp", s4: "https://luluvid.com/e/nbgcgw3o1vgk" }
    ]
  };

  function toggleSelect(id) {
    const el = document.getElementById(id);
    const wasActive = el.classList.contains('active');
    document.querySelectorAll('.custom-select').forEach(s => s.classList.remove('active'));
    if(!wasActive) el.classList.add('active');
  }

  function mostrarTemporada(num, label) {
    tActual = num; epSeleccionadoIdx = 0;
    document.getElementById('currentTempText').innerText = label;
    document.getElementById('selectTemp').classList.remove('active');
    renderGrid(); cargarEpisodio(0);
  }

  function cambiarServer(num, label) {
    sActual = num;
    document.getElementById('currentServerText').innerText = label;
    document.getElementById('selectServer').classList.remove('active');
    cargarEpisodio(epSeleccionadoIdx);
  }

  function renderGrid() {
    const grid = document.getElementById("grid-episodios"); grid.innerHTML = "";
    seriesDB[tActual].forEach((ep, idx) => {
      const card = document.createElement("div");
      card.className = `ep-card ${idx === epSeleccionadoIdx ? 'activa' : ''}`;
      card.onclick = () => {
        cargarEpisodio(idx);
        const player = document.getElementById('player-container');
        if (player) {
          player.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      };
      card.innerHTML = `<img src="${ep.t}" class="thumb" loading="lazy"><div class="ep-info">Episodio ${ep.n}</div>`;
      grid.appendChild(card);
    });
  }

  function cargarEpisodio(idx) {
    epSeleccionadoIdx = idx; const ep = seriesDB[tActual][idx];
    document.querySelectorAll('.ep-card').forEach((c, i) => i === idx ? c.classList.add('activa') : c.classList.remove('activa'));
    document.getElementById("titulo_display").innerText = `El Hombre Vapor T${tActual} - Episodio ${ep.n}`;
    document.querySelectorAll('.iframe-container iframe').forEach(f => { f.style.display = 'none'; f.src = ''; });
    const iframeActivo = document.getElementById(`iframe_s${sActual}`);
    if(iframeActivo) { 
        iframeActivo.src = ep[`s${sActual}`] || ep.s1; 
        iframeActivo.style.display = 'block'; 
    }
  }

  window.onclick = (e) => { if (!e.target.closest('.custom-select')) document.querySelectorAll('.custom-select').forEach(s => s.classList.remove('active')); };
  window.onload = () => mostrarTemporada(1, 'Temporada 1');
</script>
</body>
</html>
